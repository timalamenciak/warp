# Presentation example: one finding from Kramer et al. 1995.
#
#   "The tidal enhancement project therefore resulted in a larval reduction of
#    approximately 98.7%."  (Results, p. 392)
#
# What an annotator produces: agents, nodes, one causal statement with its
# evidence lines, study results and the source. The proposition is derived by
# scripts/derive_propositions.py (see kramer1995_statements.derived.yaml).
#
# Numbers are from the paper. Two term gaps are marked TODO: no ELMO term for
# tidal restoration yet, and the 4th-instar stage (IDOMAL:0001251) is outside
# the template's allowed life-stage prefixes, so the node uses UBERON larval
# stage.

id: warp:statementset/kramer1995-example
profile_version: 0.5.0

agents:
  - id: warp:agent/kramer1995-authors
    type: EcoAgent
    name: Kramer, Collins, Malamud-Roam and Beesley (Contra Costa Mosquito and Vector Control District)
    subtype: organization
    agent_kind: researcher
  - id: orcid:0000-0000-0000-0000
    type: EcoAgent
    name: "TODO: annotator"
    subtype: person
    agent_kind: researcher

nodes:
  - id: node:tidal_restoration_of_marsh
    name: Tidal restoration of marsh
    entity_type: management_intervention
    entity_term: tidal restoration           # TODO: Wikidata QID
  - id: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    name: Larval density of Aedes (Ochlerotatus) dorsalis
    entity_type: taxon
    entity_term: Aedes dorsalis              # TODO: Wikidata QID
    measured_attribute: PATO:0001353         # volumetric density (larvae per 400 ml dip)

node_definitions:
  - node: node:tidal_restoration_of_marsh
    template: intervention
    fillers:
      - {var: action, value: "ELMO:TODO_tidal_restoration", label: tidal restoration}   # TODO: ELMO action term
      - {var: target, value: "ENVO:00000035", label: marsh}
  # Taxon and stage IDs checked via OLS on 2026-10-27. NCBI files Aedes
  # dorsalis under its synonym Ochlerotatus dorsalis.
  - node: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    template: attribute_of_population_at_life_stage
    fillers:
      - {var: attribute, value: "PATO:0001353", label: volumetric density}
      - {var: taxon, value: "NCBITaxon:663928", label: Ochlerotatus dorsalis}
      - {var: life_stage, value: "UBERON:0000069", label: larval stage}   # TODO: IDOMAL:0001251 fourth instar larval stage

# The general question a synthesis asks: does tidal restoration typically
# reduce Aedes dorsalis larvae? No statement here asserts it, so it stays an
# open question; kramer1995_assessment.yaml assesses it with the site-level
# statement as evidence.
causal_propositions:
  - id: warp:prop/question-tidal-restoration-aedes-dorsalis
    type: CausalProposition
    subject: node:tidal_restoration_of_marsh
    predicate: prevents
    object: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    scope: prototypical
    status: open_question
    propositionText: Does restoring tidal action to a marsh typically reduce Aedes dorsalis larval density?

documents:
  - id: warp:doc/kramer1995
    type: EcoDocument
    title: Reduction of Aedes dorsalis by enhancing tidal action in a northern California marsh
    description: Journal of the American Mosquito Control Association 11(4):389-395, 1995.

# Seasonal (May-October) means of 4th-instar larvae per dip.
study_results:
  - id: warp:result/kramer1995-site-1991
    type: EcoStudyResult
    description: Project site before tidal enhancement (1991).
    focus: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    dataItems:
      - {id: warp:data/kramer1995-site-1991-mean, type: DataItem, subtype: {label: mean}, value: "3.6", unit: {label: larvae per dip}}
      - {id: warp:data/kramer1995-site-1991-range, type: DataItem, subtype: {label: range}, value: "0.0-52.8"}
      - {id: warp:data/kramer1995-site-1991-n, type: DataItem, subtype: {label: number of monitoring stations}, value: "64"}
      - {id: warp:data/kramer1995-site-1991-tides, type: DataItem, subtype: {label: number of high tide cycles}, value: "7"}
  - id: warp:result/kramer1995-site-1992
    type: EcoStudyResult
    description: Project site one season after tidal enhancement (1992).
    focus: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    dataItems:
      - {id: warp:data/kramer1995-site-1992-mean, type: DataItem, subtype: {label: mean}, value: "0.05", unit: {label: larvae per dip}}
      - {id: warp:data/kramer1995-site-1992-range, type: DataItem, subtype: {label: range}, value: "0.0-2.1"}
      - {id: warp:data/kramer1995-site-1992-n, type: DataItem, subtype: {label: number of monitoring stations}, value: "59"}
      - {id: warp:data/kramer1995-site-1992-positive, type: DataItem, subtype: {label: number of stations with larvae}, value: "3"}
      - {id: warp:data/kramer1995-site-1992-tides, type: DataItem, subtype: {label: number of high tide cycles}, value: "5"}
  - id: warp:result/kramer1995-reference-1991
    type: EcoStudyResult
    description: Surrounding marshes, not enhanced (1991).
    focus: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    dataItems:
      - {id: warp:data/kramer1995-reference-1991-mean, type: DataItem, subtype: {label: mean}, value: "2.1", unit: {label: larvae per dip}}
  - id: warp:result/kramer1995-reference-1992
    type: EcoStudyResult
    description: Surrounding marshes, not enhanced (1992).
    focus: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    dataItems:
      - {id: warp:data/kramer1995-reference-1992-mean, type: DataItem, subtype: {label: mean}, value: "3.8", unit: {label: larvae per dip}}

causal_statements:

  # The authors' statement about this marsh and this project: assertional scope.
  - id: warp:statement/kramer1995-c1
    type: CausalStatement
    subject: node:tidal_restoration_of_marsh
    predicate: prevents
    object: node:volumetric_density_of_ochlerotatus_dorsalis_population_at_larval_stage
    scope: assertional
    causal_language: direct_causal
    statementText: Restoring full tidal action to the project marsh reduced Aedes dorsalis larval density by about 98.7%.
    original_text: The tidal enhancement project therefore resulted in a larval reduction of approximately 98.7%.
    source_spans:
      - {text: "The tidal enhancement project therefore resulted in a larval reduction of approximately 98.7%.", section: results}
    dateAuthored: "1995"
    contributions:
      - {id: warp:contrib/kramer1995-c1-author, type: EcoContribution, role: author, contributor: warp:agent/kramer1995-authors}
    recordMetadata:
      dateRecordCreated: "2026-10-27T12:00:00Z"
      contributions:
        - {id: warp:contrib/kramer1995-c1-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000", date: "2026-10-27"}
    reportedIn: [warp:doc/kramer1995]
    comparator:
      - status: explicitly_asserted
        comparator_type: pre_treatment_baseline
        comparator_description: Same site and monitoring stations in 1991, before tidal enhancement.
      - status: explicitly_asserted
        comparator_type: spatial_or_temporal_control
        comparator_description: Surrounding marshlands (2.1 and 3.8 larvae/dip in 1991 and 1992), used to rule out a regional decline.
    context:
      status: explicitly_asserted
      geographic_scope: 28-ha brackish marsh on U.S. Navy property, north central Contra Costa County, California (San Francisco Bay Estuary)
      temporal_scope: 1991 (before) vs 1992 (first season after completion)
      ecosystem_scope: coastal_saltmarshes_and_reedbeds
    ecosystem_context: coastal_saltmarshes_and_reedbeds
    temporal_extent:
      duration_text: One mosquito season (May-October 1992) after the 6-week project ended in late 1991.
      observation_grain: Five 400 ml dips per inundated monitoring station after each high tide cycle
      observation_seasons: [May-October]
    predicate_qualifiers:
      philosophical_accounts: [interventionist]
      causal_direction: {status: asserted, evidence_for_direction: experimental}
      effect_strength:
        status: explicitly_asserted
        quantitative_value: "approximately 98.7% reduction in seasonal mean 4th-instar larvae per dip (3.6 to 0.05)"
        quantitative_numeric: 98.7
        qualitative_descriptor: strong
      mediation:
        status: implicitly_assumed
        pathway_description: >-
          Discussion offers, hedged: less standing water, more predator
          circulation, or disrupted conditioning of eggs.
      reversibility: not_addressed
    hasEvidenceLines:
      # Before-after at the site, with surrounding marshes as a control: a
      # single unreplicated before-after-control-impact design.
      - id: warp:el/kramer1995-c1-1
        type: EcoEvidenceLine
        evidence_type: quasi_experiment
        evidence_object: correlation
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: moderate
        evidence_item_refs:
          - warp:result/kramer1995-site-1991
          - warp:result/kramer1995-site-1992
          - warp:result/kramer1995-reference-1991
          - warp:result/kramer1995-reference-1992
        contributions:
          - {id: warp:contrib/kramer1995-c1-1-assessment, type: EcoContribution, role: evidence_assessor, contributor: "orcid:0000-0000-0000-0000"}
      # The district's own operations: larvicide applications at the site fell
      # from about 6 to 0 per year (Abstract, Discussion).
      - id: warp:el/kramer1995-c1-2
        type: EcoEvidenceLine
        evidence_type: practitioner_experience
        evidence_object: correlation
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: weak
        evidence_item_refs: [warp:doc/kramer1995]
        contributions:
          - {id: warp:contrib/kramer1995-c1-2-assessment, type: EcoContribution, role: evidence_assessor, contributor: "orcid:0000-0000-0000-0000"}
