# Presentation example, step 3: a synthesis assessment (SEPIO Proposition
# Assessment Mode) over kramer1995_statements.derived.yaml.
#
# It assesses the PROTOTYPICAL proposition ("restoring tidal action typically
# reduces Aedes dorsalis larval density"). Kramer et al.'s statement is about
# one marsh and has its own ASSERTIONAL proposition; here it enters as
# evidence for the general one. That is the case-report pattern.
#
# Grades are illustrative: one unreplicated site, one season after treatment,
# and a regional decline in 1993 at the reference marshes.

id: warp:statementset/kramer1995-assessment
profile_version: 0.5.0

agents:
  - id: warp:agent/ecoweaver-synthesis
    type: EcoAgent
    name: EcoWeaver synthesis pipeline
    subtype: software
    agent_kind: synthesis_pipeline

assessments:
  - id: warp:assessment/tidal-restoration-aedes-dorsalis-1
    type: SynthesisAssessment
    proposition: warp:prop/question-tidal-restoration-aedes-dorsalis
    scope: prototypical
    statementText: >-
      Restoring tidal action may reduce Aedes dorsalis larval density in
      marshes generally; the only evidence is one unreplicated site.
    contributions:
      - {id: warp:contrib/tidal-aedes-1-author, type: EcoContribution, role: author, contributor: warp:agent/ecoweaver-synthesis, date: "2026-10-27"}
    direction: supports
    strength: very_low
    evidence_balance: insufficient
    hasEvidenceLines:
      - id: warp:el/tidal-aedes-1-case
        type: EcoEvidenceLine
        targetProposition: warp:prop/question-tidal-restoration-aedes-dorsalis
        evidence_type: quasi_experiment
        evidence_object: correlation
        directionOfEvidenceProvided: supports
        # A large effect at one site is weak support for a typical effect.
        strengthOfEvidenceProvided: weak
        evidence_item_refs: [warp:statement/kramer1995-c1]
