# The road salt impact "cannot be properly assessed" in the source: an open
# question, not a prediction. People write it; derivation keeps its ID.
causal_propositions:
  - id: prop:question-road-salt-spring-salamander
    type: CausalProposition
    subject: node:road_salt_application
    predicate: prevents
    object: node:abundance_of_spring_salamander
    scope: contingent
    status: open_question
    propositionText: Does road salt application reduce Spring Salamander abundance? The recovery strategy says its impact cannot be properly assessed (TODO check wording).

causal_statements:

  # Mountain Sucker, approach 11: a prediction, given by DFO, resting on
  # expert opinion. "can negatively impact": hedged and contingent.
  - id: stmt:ms-11-causal
    type: CausalStatement
    subject: node:stocking_of_predacious_sportfish_milk_river
    predicate: prevents
    object: node:abundance_of_mountain_sucker_milk_river
    scope: contingent
    modality: anticipated
    causal_language: uncertain_causal
    statementText: Stocking competitive or predacious sportfish can reduce the abundance of the Milk River Mountain Sucker population.
    original_text: "TODO: verbatim wording of Table 4, approach 11"
    contributions:
      - {id: warp:contrib/ms-11-causal-author, type: EcoContribution, role: author, contributor: org:dfo}
    recordMetadata:
      contributions:
        - {id: warp:contrib/ms-11-causal-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:dfo-mountain-sucker-recovery-strategy]
    place: ["TODO:place_milk_river_drainage"]
    hasEvidenceLines:
      - id: warp:el/ms-11-causal-1
        type: EcoEvidenceLine
        evidence_type: expert_judgment
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: not_assessed
        evidence_item_refs: [doc:dfo-mountain-sucker-recovery-strategy]

  # Mountain Sucker, approach 9: a prediction asserted with no basis given.
  - id: stmt:ms-09-causal
    type: CausalStatement
    subject: node:water_extraction_milk_river
    predicate: prevents
    object: node:habitat_quantity_of_mountain_sucker_milk_river
    scope: contingent
    modality: anticipated
    causal_language: uncertain_causal
    statementText: Water extraction or degradation could reduce habitat quantity and quality for the Milk River Mountain Sucker.
    original_text: "TODO: verbatim wording of Table 4, approach 9"
    contributions:
      - {id: warp:contrib/ms-09-causal-author, type: EcoContribution, role: author, contributor: org:dfo}
    recordMetadata:
      contributions:
        - {id: warp:contrib/ms-09-causal-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:dfo-mountain-sucker-recovery-strategy]
    place: ["TODO:place_milk_river_drainage"]
    hasEvidenceLines:
      - id: warp:el/ms-09-causal-1
        type: EcoEvidenceLine
        evidence_type: not_stated
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: not_assessed

  # A field study (placeholder) on prescribed burning and shrub cover: the
  # causal proposition both sides of the burning disagreement cite.
  - id: stmt:burn-study-c1
    type: CausalStatement
    subject: node:prescribed_burning_of_grassland
    predicate: prevents
    object: node:shrub_cover_in_grassland
    scope: prototypical
    modality: observed
    causal_language: direct_causal
    statementText: Prescribed burning reduces shrub cover in grassland.
    original_text: "TODO: verbatim sentence from the study"
    contributions:
      - {id: warp:contrib/burn-study-c1-author, type: EcoContribution, role: author, contributor: warp:agent/burn-study-authors}
    recordMetadata:
      contributions:
        - {id: warp:contrib/burn-study-c1-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:burn-study]
    hasEvidenceLines:
      - id: warp:el/burn-study-c1-1
        type: EcoEvidenceLine
        evidence_type: randomized_experiment
        evidence_object: correlation
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: not_assessed
        evidence_item_refs: [doc:burn-study]

recommendation_statements:

  # Avoid: stocking predacious sportfish (approach 11). Priority Medium,
  # timing Medium. Cites DFO's own prediction, which rests on expert
  # judgment: self-supporting guidance, flagged by report_guidance.py.
  - id: stmt:ms-11-rec
    type: RecommendationStatement
    subject: node:stocking_of_predacious_sportfish_milk_river
    predicate: suggested_to
    object: node:decrease_in_abundance_of_mountain_sucker_milk_river
    scope: contingent
    modality: anticipated
    statementText: Avoid stocking competitive or predacious sportfish in the Milk River drainage, because it can reduce Mountain Sucker abundance.
    original_text: "TODO: verbatim wording of Table 4, approach 11"
    predicate_qualifiers:
      guidance: avoid
      deontic_force: recommended
      priority: {value: Medium, scale: "scale:dfo-recovery-priority", concept: "scale:dfo-recovery-priority/medium"}
      timing_of_influence: {value: Medium, scale: "scale:dfo-timing-of-influence", concept: "scale:dfo-timing-of-influence/medium"}
      contribution: direct
    justified_by: [warp:prop/4f9905a0d7a2]          # derived from stmt:ms-11-causal
    contributions:
      - {id: warp:contrib/ms-11-rec-author, type: EcoContribution, role: author, contributor: org:dfo}
    recordMetadata:
      contributions:
        - {id: warp:contrib/ms-11-rec-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:dfo-mountain-sucker-recovery-strategy]
    place: ["TODO:place_milk_river_drainage"]
    hasEvidenceLines:
      - id: warp:el/ms-11-rec-1
        type: EcoEvidenceLine
        evidence_type: expert_judgment
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: not_assessed

  # Do: water management and conservation (approach 9). Priority High,
  # timing Immediate. Cites DFO's own unsupported prediction.
  - id: stmt:ms-09-rec
    type: RecommendationStatement
    subject: node:water_conservation_measures_milk_river
    predicate: suggested_to
    object: node:maintained_habitat_quantity_of_mountain_sucker_milk_river
    scope: contingent
    modality: anticipated
    statementText: Carry out water management and conservation in the Milk River drainage, to maintain habitat quantity and quality for Mountain Sucker.
    original_text: "TODO: verbatim wording of Table 4, approach 9"
    predicate_qualifiers:
      guidance: do
      deontic_force: recommended
      priority: {value: High, scale: "scale:dfo-recovery-priority", concept: "scale:dfo-recovery-priority/high"}
      timing_of_influence: {value: Immediate, scale: "scale:dfo-timing-of-influence", concept: "scale:dfo-timing-of-influence/immediate"}
      contribution: direct
    justified_by: [warp:prop/c16be9de6aa6]          # derived from stmt:ms-09-causal
    contributions:
      - {id: warp:contrib/ms-09-rec-author, type: EcoContribution, role: author, contributor: org:dfo}
    recordMetadata:
      contributions:
        - {id: warp:contrib/ms-09-rec-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:dfo-mountain-sucker-recovery-strategy]
    place: ["TODO:place_milk_river_drainage"]

  # The prescribed burning pair: "do" from a grassland plan, "avoid" from an
  # air quality agency, same action, same outcome, citing the same causal
  # proposition. They derive two recommendation propositions.
  - id: stmt:burn-do-plan
    type: RecommendationStatement
    subject: node:prescribed_burning_of_grassland
    predicate: suggested_to
    object: node:decrease_in_shrub_cover_in_grassland
    scope: prototypical
    statementText: Use prescribed burning to reduce shrub cover in grassland.
    predicate_qualifiers: {guidance: do, deontic_force: recommended}
    justified_by: [warp:prop/247fc9907bf5]          # derived from stmt:burn-study-c1
    contributions:
      - {id: warp:contrib/burn-do-plan-author, type: EcoContribution, role: author, contributor: org:grassland-plan-authors}
    recordMetadata:
      contributions:
        - {id: warp:contrib/burn-do-plan-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:grassland-plan]
  - id: stmt:burn-avoid-agency
    type: RecommendationStatement
    subject: node:prescribed_burning_of_grassland
    predicate: suggested_to
    object: node:decrease_in_shrub_cover_in_grassland
    scope: prototypical
    statementText: Avoid prescribed burning as a means of reducing shrub cover, because of the smoke it produces.
    predicate_qualifiers: {guidance: avoid, deontic_force: suggested}
    justified_by: [warp:prop/247fc9907bf5]          # the same causal proposition
    contributions:
      - {id: warp:contrib/burn-avoid-agency-author, type: EcoContribution, role: author, contributor: org:air-quality-agency}
    recordMetadata:
      contributions:
        - {id: warp:contrib/burn-avoid-agency-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:air-quality-guidance]

  # A practitioner gives the same guidance as the plan, with no reason: it
  # joins the plan's "do" proposition (two claimants, one proposition), and
  # report_guidance.py lists it as guidance with empty justified_by.
  - id: stmt:burn-do-practitioner
    type: RecommendationStatement
    subject: node:prescribed_burning_of_grassland
    predicate: suggested_to
    object: node:decrease_in_shrub_cover_in_grassland
    scope: prototypical
    statementText: Burn the grassland to knock back the shrubs.
    original_text: "TODO: notebook wording"
    predicate_qualifiers: {guidance: do}
    contributions:
      - {id: warp:contrib/burn-do-practitioner-author, type: EcoContribution, role: author, contributor: person:practitioner-2}
    recordMetadata:
      contributions:
        - {id: warp:contrib/burn-do-practitioner-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}
    reportedIn: [doc:notebook-entry-2]
    care:
      knowledge_holders: [person:practitioner-2]
      access_level: attribution_required

# A synthesis assessment of the burning study's proposition (illustrative
# grade), so the guidance report can show how well each cited proposition is
# supported.
assessments:
  - id: warp:assessment/burning-shrub-cover-1
    type: SynthesisAssessment
    proposition: warp:prop/247fc9907bf5
    statementText: "Illustrative: the evidence that prescribed burning typically reduces shrub cover is supportive, of moderate certainty."
    contributions:
      - {id: warp:contrib/burning-shrub-cover-1-author, type: EcoContribution, role: author, contributor: warp:agent/ecoweaver-synthesis}
    direction: supports
    strength: moderate
    evidence_balance: supportive
    hasEvidenceLines:
      - id: warp:el/burning-shrub-cover-1-study
        type: EcoEvidenceLine
        targetProposition: warp:prop/247fc9907bf5
        evidence_type: randomized_experiment
        evidence_object: correlation
        directionOfEvidenceProvided: supports
        strengthOfEvidenceProvided: moderate
        evidence_item_refs: [stmt:burn-study-c1]
