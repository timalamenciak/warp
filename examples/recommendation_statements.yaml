# Recommendation group: worked example.
#
# Guidance from two SARA recovery strategies, and an illustrative prescribed
# burning case, recorded as recommendation statements that cite causal
# propositions through justified_by. Predictions are recorded as causal
# statements of their own (modality anticipated), never derived from the
# guidance.
#
# ILLUSTRATIVE ONLY. Wording, priorities and timings follow the proposal
# (docs/proposals/warp-proposals-0.4.html, section 5); node fillings, agents,
# documents and the burning case are placeholders, marked TODO. Nothing here
# should be read as what the recovery strategies say until checked against
# them.
#
# justified_by cites propositions by ID. Causal propositions are derived, so
# their IDs are the hashes derive_propositions.py computes (in a database the
# annotator picks them from propositions that already exist). The road salt
# question is an open question with a readable ID, written by people.

id: warp:statementset/recommendation-example
profile_version: 0.7.0

