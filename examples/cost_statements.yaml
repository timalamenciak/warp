# Cost group: worked example (0.7.0, Phase 6).
#
# What actions took to carry out, with the context needed to read the number
# (Iacona et al. 2018's five reporting standards).
#
# The INPA wattle costing and the Florida program use the figures Iacona et
# al.'s worked examples give, as the proposal does
# (docs/proposals/warp-proposals-0.4.html, section 8): about 600 ha for NIS
# 17,600 (price year assumed from the report date), and about 70,000 ha over 46
# protected areas. The strategy costs use the proposal's illustrative figures.
# Everything else is a placeholder: statements whose text begins "Placeholder"
# carry no real figures, and amounts with no value record a figure not yet
# transcribed (TODO).

id: warp:statementset/cost-example
profile_version: 0.7.0

agents:
  - {id: org:israel-nature-parks-authority, type: EcoAgent, name: Israel Nature and Parks Authority, subtype: organization, agent_kind: organization}
  - {id: org:florida-fwc, type: EcoAgent, name: Florida Fish and Wildlife Conservation Commission, subtype: organization, agent_kind: organization}
  - {id: org:land-trust-a, type: EcoAgent, name: "TODO: a land trust (source A)", subtype: organization, agent_kind: organization}
  - {id: org:agency-c, type: EcoAgent, name: "TODO: a regional conservation agency", subtype: organization, agent_kind: organization}
  - {id: person:practitioner-b, type: EcoAgent, name: "TODO: practitioner name or pseudonym", subtype: person, agent_kind: practitioner}
  - {id: orcid:0000-0000-0000-0000, type: EcoAgent, name: "TODO: annotator", subtype: person, agent_kind: researcher}

documents:
  - {id: doc:oron-hamod-2008, type: EcoDocument, title: "Oron and Hamod 2008, golden wreath wattle control on Israel's coast, as reported in Iacona et al. 2018 (TODO: full citation)"}
  - {id: doc:fwc-program-report, type: EcoDocument, title: "TODO: Florida invasive plant management program allocations, 1999-2010, as reported by Iacona et al."}
  - {id: doc:project-report-x, type: EcoDocument, title: "TODO: project report X (source A)"}
  - {id: doc:agency-c-costings, type: EcoDocument, title: "TODO: an agency's wattle removal costings"}
  - {id: doc:notebook-entry-4, type: EcoDocument, subtype: {label: field notebook}}

nodes:
  - {id: node:cut_treat_acacia_saligna_coastal_reserves, name: "Cutting, stump treatment and seedling control of Acacia saligna in coastal protected areas", entity_type: management_intervention, entity_term: "TODO: Acacia saligna control"}
  - {id: node:native_vegetation_cover_coastal_reserves, name: Native vegetation cover in the coastal protected areas, entity_type: environmental_variable, entity_term: native vegetation cover}
  - {id: node:abundance_of_acacia_saligna_seedlings, name: Abundance of Acacia saligna seedlings, entity_type: taxon, entity_term: "TODO: Acacia saligna"}
  - {id: node:herbicide_mechanical_control_invasive_plants_florida_pa, name: Herbicide and mechanical control of invasive plants in Florida protected areas, entity_type: management_intervention, entity_term: "TODO: invasive plant control"}
  - {id: node:drill_seeding_native_grassland_mix, name: Drill seeding of a native grassland mix, entity_type: management_intervention, entity_term: "TODO: drill seeding"}
  - {id: node:planting_plugs_native_grassland, name: Planting native grassland plugs, entity_type: management_intervention, entity_term: "TODO: plug planting"}
  - {id: node:manual_removal_of_acacia_saligna, name: Manual removal of Acacia saligna, entity_type: management_intervention, entity_term: "TODO: Acacia saligna removal"}

study_results:
  - id: warp:result/inpa-wattle-project
    type: EcoStudyResult
    focus: node:native_vegetation_cover_coastal_reserves
    reportedIn: ["doc:oron-hamod-2008"]
    description: The costed wattle control work, as the evidence layer records it.
    stated_goal: "TODO: the project's aim, in Oron and Hamod's words"

# Same-source causal statements about what the spending achieved: the bridge
# to cost-effectiveness (outcome_reported).
causal_statements:
  - id: stmt:inpa-wattle-natives-regenerate
    type: CausalStatement
    subject: node:cut_treat_acacia_saligna_coastal_reserves
    predicate: causes
    object: node:native_vegetation_cover_coastal_reserves
    scope: assertional
    modality: observed
    causal_language: associational
    statementText: After treatment, native vegetation regenerated in the treated areas.
    contributions: [{id: warp:contrib/inpa-natives-author, type: EcoContribution, role: author, contributor: org:israel-nature-parks-authority}]
    recordMetadata: {contributions: [{id: warp:contrib/inpa-natives-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:oron-hamod-2008]
    place: ["place:mediterranean-coastal-israel"]
    hasEvidenceLines:
      - {id: warp:el/inpa-natives-1, type: EcoEvidenceLine, evidence_type: case_study, directionOfEvidenceProvided: supports}
  - id: stmt:inpa-wattle-seedlings-persist
    type: CausalStatement
    subject: node:cut_treat_acacia_saligna_coastal_reserves
    predicate: prevents
    object: node:abundance_of_acacia_saligna_seedlings
    negated: true
    scope: assertional
    modality: observed
    causal_language: no_relationship
    statementText: Treatment did not prevent wattle seedlings from persisting.
    contributions: [{id: warp:contrib/inpa-seedlings-author, type: EcoContribution, role: author, contributor: org:israel-nature-parks-authority}]
    recordMetadata: {contributions: [{id: warp:contrib/inpa-seedlings-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:oron-hamod-2008]
    place: ["place:mediterranean-coastal-israel"]
    hasEvidenceLines:
      - {id: warp:el/inpa-seedlings-1, type: EcoEvidenceLine, evidence_type: case_study, directionOfEvidenceProvided: supports}

cost_statements:

  # Intervention-level costing with a reported outcome (Iacona et al.'s
  # first worked example).
  - id: stmt:inpa-wattle-cost
    type: CostStatement
    subject: node:cut_treat_acacia_saligna_coastal_reserves
    predicate: incurs_cost
    object: total
    scope: assertional
    place: ["place:mediterranean-coastal-israel"]      # a place, not a functional group
    statementText: Treating about 600 ha of golden wreath wattle cost about NIS 17,600.
    predicate_qualifiers:
      amount: {value: 17600, currency: ILS, price_year: 2008, adjustment: none}   # price year assumed from the report date
      includes_categories: [unknown]
      scale: [{value: 600, unit: "TODO:unit_hectare"}]
      phase: whole_project
      reporting_level: intervention
      cost_basis: actual_expenditure
    outcome_reported: [stmt:inpa-wattle-natives-regenerate, stmt:inpa-wattle-seedlings-persist]
    contributions: [{id: warp:contrib/inpa-wattle-cost-author, type: EcoContribution, role: author, contributor: org:israel-nature-parks-authority}]
    recordMetadata: {contributions: [{id: warp:contrib/inpa-wattle-cost-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:oron-hamod-2008]

  # Program-level budget with unknown categories (Iacona et al.'s second
  # example). The amount and price year are not transcribed yet (TODO); 46
  # protected areas is a count, not a unit.
  - id: stmt:fwc-invasive-program
    type: CostStatement
    subject: node:herbicide_mechanical_control_invasive_plants_florida_pa
    predicate: incurs_cost
    object: total
    scope: assertional
    place: ["ISO3166-2:US-FL"]
    period: {start: "1999", end: "2010"}
    statementText: Florida allocated funds for invasive plant management on 46 protected areas, about 70,000 ha, from 1999 to 2010.
    predicate_qualifiers:
      amount: {currency: USD}                          # TODO: value and price year
      includes_categories: [unknown]
      scale: [{value: 69996, unit: "TODO:unit_hectare"}]
      count: [{value: 46, entity: "TODO:protected_area"}]
      phase: maintenance
      reporting_level: program
      cost_basis: budget_allocation
    contributions: [{id: warp:contrib/fwc-invasive-program-author, type: EcoContribution, role: author, contributor: org:florida-fwc}]
    recordMetadata: {contributions: [{id: warp:contrib/fwc-invasive-program-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:fwc-program-report]

  # A practitioner's relative cost: drill seeding about a third of plugs.
  - id: stmt:practitioner-drill-vs-plugs
    type: CostStatement
    subject: node:drill_seeding_native_grassland_mix
    predicate: costs_relative_to
    object: node:planting_plugs_native_grassland
    scope: contingent
    place: ["place:northern-great-plains"]
    statementText: Drill seeding a native mix costs about a third of planting plugs, per hectare.
    original_text: "TODO: notebook wording"
    predicate_qualifiers:
      ratio: {value: 0.33, basis: per_hectare}
      phase: initial
      cost_basis: estimate
    contributions: [{id: warp:contrib/practitioner-drill-vs-plugs-author, type: EcoContribution, role: author, contributor: person:practitioner-b}]
    recordMetadata: {contributions: [{id: warp:contrib/practitioner-drill-vs-plugs-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:notebook-entry-4]
    care: {knowledge_holders: [person:practitioner-b], access_level: attribution_required}

  # A whole-project cost on the Phase 4 earthworks-seed-mow strategy, by its
  # canonical node (examples/strategy_statements.yaml). Illustrative figures
  # from the proposal.
  - id: stmt:land-trust-strategy-total
    type: CostStatement
    subject: node:strategy-f38f3a2661ee
    predicate: incurs_cost
    object: total
    scope: assertional
    place: ["TODO:place_project_x_site"]
    statementText: "Illustrative: recontouring, seeding and three years of mowing on 42 ha cost $48,000."
    predicate_qualifiers:
      amount: {value: 48000, currency: CAD, price_year: 2025}
      includes_categories: [unknown]
      scale: [{value: 42, unit: "TODO:unit_hectare"}]
      phase: whole_project
      reporting_level: intervention
      cost_basis: actual_expenditure
    contributions: [{id: warp:contrib/land-trust-strategy-total-author, type: EcoContribution, role: author, contributor: org:land-trust-a}]
    recordMetadata: {contributions: [{id: warp:contrib/land-trust-strategy-total-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:project-report-x]

  # A phase-level cost of the same strategy, in effort, naming the components
  # it covers by role. Illustrative figures.
  - id: stmt:land-trust-strategy-follow-up-labour
    type: CostStatement
    subject: node:strategy-f38f3a2661ee
    predicate: incurs_cost
    object: labour
    scope: assertional
    place: ["TODO:place_project_x_site"]
    statementText: "Illustrative: the three years of mowing took 12 person-days of labour."
    predicate_qualifiers:
      effort: [{value: 12, unit: "TODO:unit_person_day"}]
      scale: [{value: 42, unit: "TODO:unit_hectare"}]
      phase: follow_up
      covers_roles: [follow_up]
      reporting_level: intervention
      cost_basis: actual_expenditure
    contributions: [{id: warp:contrib/land-trust-follow-up-author, type: EcoContribution, role: author, contributor: org:land-trust-a}]
    recordMetadata: {contributions: [{id: warp:contrib/land-trust-follow-up-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:project-report-x]

  # Two intervention-level initial costings in the same region derive one
  # proposition; a maintenance costing of the same action does not join it.
  - id: stmt:agency-c-removal-initial-1
    type: CostStatement
    subject: node:manual_removal_of_acacia_saligna
    predicate: incurs_cost
    object: total
    scope: assertional
    place: ["place:mediterranean-coastal-israel"]
    statementText: "Placeholder: an initial costing of manual wattle removal (site 1)."
    predicate_qualifiers:
      amount: {currency: ILS}                          # TODO: value and price year
      includes_categories: [labour, consumables]
      scale: [{value: 100, unit: "TODO:unit_hectare"}]  # placeholder
      phase: initial
      reporting_level: intervention
      cost_basis: actual_expenditure
    contributions: [{id: warp:contrib/agency-c-initial-1-author, type: EcoContribution, role: author, contributor: org:agency-c}]
    recordMetadata: {contributions: [{id: warp:contrib/agency-c-initial-1-annotation, type: EcoContribution, role: annotator, contributor: "orcid:0000-0000-0000-0000"}]}
    reportedIn: [doc:agency-c-costings]
  - id: stmt:agency-c-removal-initial-2
