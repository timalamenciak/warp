    subject: node:manual_removal_of_acacia_saligna
    predicate: incurs_cost
    object: total
    scope: assertional
    place: ["place:mediterranean-coastal-israel"]
    statementText: "Placeholder: an initial costing of manual wattle removal (site 2)."
    predicate_qualifiers:
      amount: {currency: ILS}                          # TODO: value and price year
      includes_categories: [labour, consumables]
