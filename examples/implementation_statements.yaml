# Sites, implementation and criteria: worked example (0.7.0, Phase 7).
#
# A land trust and its funder report grassland work on one agreement site;
# the same strategy is carried out on a second site; assessors judge the
# sites degraded, or not, under two different definitions, and judge one
# project effective. derive_projects.py groups the implementation statements
# into projects; report_target2.py counts areas under chosen definitions.
#
# ILLUSTRATIVE ONLY. Every ID, figure, geometry and definition is a
# placeholder; the criteria sets are FICTIONAL definitions, not any body's
# real one. The strategy is the canonical earthworks-seed-mow node of
# examples/strategy_statements.yaml.

